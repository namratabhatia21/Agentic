upstream agentic_api {
    server api:8000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=chat:10m rate=30r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/html application/json text/css application/javascript;

    # Metrics are for Prometheus on the internal network only.
    location = /metrics { deny all; }

    location /api/chat {
        limit_req zone=chat burst=10 nodelay;
        proxy_pass http://agentic_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events: no buffering, long reads for multi-step agent turns.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://agentic_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
